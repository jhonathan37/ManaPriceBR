name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name manaprice_br .
      - name: Configure Android production permissions and OCR dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = (
              '<uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
          )
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permissions)
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          deps = '''\n\ndependencies {\n    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")\n    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")\n    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")\n    implementation("com.google.mlkit:text-recognition-korean:16.0.1")\n}\n'''
          if 'text-recognition-chinese' not in g:
              gradle.write_text(g + deps)
          PY
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Build Android release AAB
        run: flutter build appbundle --release
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manapricebr-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: manapricebr-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Android release AAB
        uses: actions/upload-artifact@v4
        with:
          name: manapricebr-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
